x-app-env: &app-env
  APP_NAME: \Relaticle Dev 7i2
  APP_ENV: \production
  APP_KEY: \base64:bZzT7mxRFdjOQVNxkKcNhPU89rVqV+FEwOv9zN+N2kA=
  APP_DEBUG: \false
  APP_URL: \https://dev.7i2.com
  DB_CONNECTION: \pgsql
  DB_HOST: \postgres
  DB_PORT: \5432
  DB_DATABASE: \relaticle_dev
  DB_USERNAME: \relaticle_dev
  DB_PASSWORD: \WeysJ5vgI5weQBiKCJtqjvXF
  REDIS_HOST: \redis
  REDIS_PORT: \6379
  CACHE_STORE: \redis
  SESSION_DRIVER: \redis
  QUEUE_CONNECTION: \redis
  MAIL_MAILER: \log

services:
  app:
    build:
      context: .
    image: domarstvo-relaticle-dev2:local
    restart: unless-stopped
    environment:
      <<: *app-env
      VIRTUAL_HOST: dev.7i2.com
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: dev.7i2.com
      LETSENCRYPT_EMAIL: logs@helveticom.com
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy-net
      - relaticle-dev-internal

  horizon:
    image: domarstvo-relaticle-dev2:local
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["php", "artisan", "horizon"]
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - relaticle-dev-internal

  scheduler:
    image: domarstvo-relaticle-dev2:local
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    networks:
      - relaticle-dev-internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: \relaticle_dev
      POSTGRES_USER: \relaticle_dev
      POSTGRES_PASSWORD: \WeysJ5vgI5weQBiKCJtqjvXF
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \relaticle_dev -d \relaticle_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - relaticle-dev-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - relaticle-dev-internal

networks:
  proxy-net:
    external: true
  relaticle-dev-internal:
    driver: bridge

volumes:
  postgres:
  redis:
  storage:
